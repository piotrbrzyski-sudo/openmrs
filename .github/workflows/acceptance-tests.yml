name: OpenMRS hybrid acceptance tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openmrs-hybrid-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run API client contract tests
        run: >
          mvn --batch-mode --no-transfer-progress clean test
          -Dsurefire.suiteXmlFiles=src/test/resources/testng-contract.xml

      - name: Upload contract test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: openmrs-contract-test-reports
          path: target/surefire-reports
          if-no-files-found: warn
          retention-days: 14

  acceptance-tests:
    needs: contract-tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HEADLESS: "true"
      BROWSER: chrome
      OPENMRS_UI_BASE_URL: http://localhost:8080/openmrs
      OPENMRS_API_BASE_URL: http://localhost:8080/openmrs/ws/rest/v1
      OPENMRS_USERNAME: admin
      OPENMRS_PASSWORD: Admin123
      OPENMRS_LOGIN_LOCATION: Inpatient Ward
      OPENMRS_VISIT_TYPE: Facility Visit

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v2

      - name: Start controlled OpenMRS environment
        run: docker compose up --detach
      
      - name: Wait for initial OpenMRS bootstrap
        shell: bash
        timeout-minutes: 10
        run: |
          echo "Waiting for the first OpenMRS bootstrap to complete..."
      
          for i in {1..120}; do
            docker compose logs --no-color openmrs > /tmp/openmrs-bootstrap.log 2>&1 || true
      
            REST_CONFIGURED=false
            CONTEXT_REFRESHED=false
      
            if grep -Fq "webservices.rest.started value: true" /tmp/openmrs-bootstrap.log; then
              REST_CONFIGURED=true
            fi
      
            if grep -Fq "Done refreshing Context" /tmp/openmrs-bootstrap.log; then
              CONTEXT_REFRESHED=true
            fi
      
            echo "Attempt $i/120 - REST configured: $REST_CONFIGURED, context refreshed: $CONTEXT_REFRESHED"
      
            if [ "$REST_CONFIGURED" = true ] && [ "$CONTEXT_REFRESHED" = true ]; then
              echo "Initial OpenMRS bootstrap completed."
              echo "Giving OpenMRS 30 seconds to finish post-start work..."
              sleep 30
              exit 0
            fi
      
            sleep 5
          done
      
          echo "OpenMRS initial bootstrap did not complete."
          echo
          echo "=== Docker status ==="
          docker compose ps
      
          echo
          echo "=== Last 300 OpenMRS log lines ==="
          tail -n 300 /tmp/openmrs-bootstrap.log
      
          exit 1
      
      - name: Restart OpenMRS after first boot
        shell: bash
        run: |
          echo "Restarting OpenMRS so web modules are registered during a clean startup..."
          docker compose restart openmrs
      
      - name: Wait for OpenMRS REST API
        shell: bash
        timeout-minutes: 10
        run: |
          echo "Waiting for OpenMRS REST API..."
      
          for i in {1..120}; do
            RESPONSE="$(
              curl \
                --silent \
                --fail \
                --user "${OPENMRS_USERNAME}:${OPENMRS_PASSWORD}" \
                "${OPENMRS_API_BASE_URL}/session" \
                2>/dev/null || true
            )"
      
            if echo "$RESPONSE" | grep --quiet '"authenticated":true'; then
              echo "OpenMRS REST API is ready."
              exit 0
            fi
      
            echo "REST API not ready yet - attempt $i/120"
            sleep 5
          done
      
          echo "OpenMRS REST API did not become ready."
          echo
          echo "=== docker compose ps ==="
          docker compose ps
      
          echo
          echo "=== OpenMRS logs ==="
          docker compose logs --no-color --tail=500 openmrs
      
          exit 1

      - name: Run the controlled Cucumber acceptance suite
        run: >
          mvn --batch-mode --no-transfer-progress clean test
          -Dsurefire.suiteXmlFiles=src/test/resources/testng-acceptance.xml

      - name: Capture OpenMRS service logs
        if: always()
        shell: bash
        run: |
          mkdir -p target
          docker compose logs --no-color > target/openmrs-compose.log

      - name: Upload acceptance test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: openmrs-acceptance-test-reports
          path: |
            target/cucumber-reports
            target/surefire-reports
            target/openmrs-compose.log
          if-no-files-found: warn
          retention-days: 14

      - name: Stop the controlled OpenMRS environment
        if: always()
        run: docker compose down --volumes --remove-orphans
